<!DOCTYPE html>
<html>
<head>
    <title>About Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: "Press Start 2P", system-ui;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #555555;
            font-size: 18px;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
.button {
    display: inline-block;
    /* 1. Medieval brown background */
    background-color: #8b4513; 
    color: #f5deb3; /* Wheat colored text */
    padding: 15px 30px;
    margin-top: 15px;
    text-decoration: none;
    /* 2. Thick, sharp, pixel-style border */
    border: 4px solid #5d300d; 
      font-family: "Press Start 2P", system-ui;
  font-weight: 400;
  font-style: cursive;
    text-transform: uppercase; /* ALL CAPS for game text */
    letter-spacing: 1px;
    /* Flat edges, no rounding */
    border-radius: 0; 
    /* Little shadow for depth */
    box-shadow: 3px 3px 0px #333; 
    /* Important for the hover arrow */
    position: relative; 
    transition: transform 0.1s; /* Quick press effect */
}

/* The Hover Effect */
.button:hover {
    background-color: #a0522d; /* Lighter brown on hover */
    top: -2px; /* Move up slightly */
    left: -2px;
    box-shadow: 5px 5px 0px #333; /* Bigger shadow */
}

/* 4. Add a little pixel arrow ">" before the text on hover */
.button:hover::before {
    content: "> ";
    color: #ffd700; /* Gold color */
}

    </style>
</head>
<body>

    <h1>let's check on the Stew...</h1>
    <p>it's looking very tasty!</p>

    <!-- A link back to your home page -->
<a href="index.html" class="button">step back</a>


</body>
</html>
