/* Container to hold the button and menu together */
.dropdown-container {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
}

/* The Book Button */
.book-button {
    display: inline-block;
    background-color: #fdf5e6; /* Parchment color */
    color: #5d300d; /* Dark brown text */
    border: 3px solid #8b4513; /* Leather spine/border */
    padding: 10px 15px;
    text-decoration: none;
    font-family: "Press Start 2P", system-ui;
    font-size: 10px;
    box-shadow: 3px 3px 0px #333;
}

.book-button:hover {
    background-color: #fff8dc;
}

/* The hidden drop-down menu box */
.dropdown-content {
    display: none; /* Hidden by default */
    position: absolute;
    top: 45px; /* Sits right below the book button */
    left: 0;
    background-color: #fdf5e6;
    min-width: 140px;
    border: 3px solid #8b4513;
    box-shadow: 4px 4px 0px #333;
}

/* Links inside the drop-down menu */
.dropdown-content a {
    display: block;
    color: #5d300d;
    padding: 10px;
    text-decoration: none;
    font-family: "Press Start 2P", system-ui;
    font-size: 8px;
    text-align: left;
    margin: 0;
    border-bottom: 2px dashed #d2b48c; /* Looks like notebook lines */
}

/* Remove border from the very last item */
.dropdown-content a:last-child {
    border-bottom: none;
}

/* Hover effect for the menu items */
.dropdown-content a:hover {
    background-color: #f5deb3;
    color: #8b4513;
    text-decoration: none;
}

/* Reveal the menu when hovering over the container */
.dropdown-container:hover .dropdown-content {
    display: block;
}

.button {
    display: inline-block;
    /* 1. Medieval brown background */
    background-color: #8b4513; 
    color: #f5deb3; /* Wheat colored text */
    padding: 15px 30px;
    margin-top: 15px;
    text-decoration: none;
    /* 2. Thick, sharp, pixel-style border */
    border: 4px solid #5d300d; 
    font-family: "Press Start 2P", system-ui;
    font-weight: 400;
    font-style: normal;
    text-transform: uppercase; /* ALL CAPS for game text */
    letter-spacing: 1px;
    /* Flat edges, no rounding */
    border-radius: 0; 
    /* Little shadow for depth */
    box-shadow: 3px 3px 0px #333; 
    /* Important for the hover arrow */
    position: relative; 
    transition: transform 0.1s; /* Quick press effect */
}

/* The Hover Effect */
.button:hover {
    background-color: #a0522d; /* Lighter brown on hover */
    top: -2px; /* Move up slightly */
    left: -2px;
    box-shadow: 5px 5px 0px #333; /* Bigger shadow */
}

/* 4. Add a little pixel arrow ">" before the text on hover */
.button:hover::before {
    content: "> ";
    color: #ffd700; /* Gold color */
}
