<!DOCTYPE html>
<html>
<head>
    <title>sit by the fire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
.book-button {
    position: fixed; /* Keeps it pinned to the top left even when scrolling */
    top: 20px;
    left: 20px;
    background-color: #fdf5e6; /* Parchment/paper color */
    color: #5d300d; /* Dark brown text */
    border: 3px solid #8b4513; /* Leather spine/border */
    padding: 10px 15px;
    text-decoration: none;
    font-family: "Press Start 2P", system-ui;
    font-size: 10px;
    box-shadow: 3px 3px 0px #333;
    z-index: 1000;
}

.book-button:hover {
    background-color: #fff8dc;
    top: 18px; /* Slight lift effect */
    left: 18px;
    box-shadow: 4px 4px 0px #333;
}



        body {
            background-color: #f4f6f9;
            font-family: "Press Start 2P", system-ui;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #2c3e50;
            font-size: 20px; /* Adjusted slightly so pixel font fits nicely */
        }
        p {
            color: #555555;
            font-size: 12px; /* Adjusted slightly for pixel font */
        }
        img {
            width: 300px;
            border-radius: 10px;
            margin-top: 20px;
        }
        a {
            display: block;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
.button {
    display: inline-block;
    /* 1. Medieval brown background */
    background-color: #8b4513; 
    color: #f5deb3; /* Wheat colored text */
    padding: 15px 30px;
    margin-top: 15px;
    text-decoration: none;
    /* 2. Thick, sharp, pixel-style border */
    border: 4px solid #5d300d; 
    font-family: "Press Start 2P", system-ui;
    font-weight: 400;
    font-style: normal;
    text-transform: uppercase; /* ALL CAPS for game text */
    letter-spacing: 1px;
    /* Flat edges, no rounding */
    border-radius: 0; 
    /* Little shadow for depth */
    box-shadow: 3px 3px 0px #333; 
    /* Important for the hover arrow */
    position: relative; 
    transition: transform 0.1s; /* Quick press effect */
}

/* The Hover Effect */
.button:hover {
    background-color: #a0522d; /* Lighter brown on hover */
    top: -2px; /* Move up slightly */
    left: -2px;
    box-shadow: 5px 5px 0px #333; /* Bigger shadow */
}

/* 4. Add a little pixel arrow ">" before the text on hover */
.button:hover::before {
    content: "> ";
    color: #ffd700; /* Gold color */
}

    </style>
</head>
<body>

    <!-- Book button fixed to the top left -->
    <a href="book.html" class="book-button">📖 Book</a>

    <h1>welcome to my Circle!</h1>
    <p>i am cooking a Stew...</p>

    <!-- This adds an image from your folder -->
    <img src="catfish.jpeg" alt="A placeholder photo">
    
    <!-- A link to your new About page -->
    <a href="about.html" class="button">come a little closer...</a>

</body>
</html>
